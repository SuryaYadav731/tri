version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: df_postgres
    environment:
      POSTGRES_USER: df_user
      POSTGRES_PASSWORD: df_password
      POSTGRES_DB: df_command_center
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  redis:
    image: redis:alpine
    container_name: df_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
